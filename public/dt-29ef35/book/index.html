<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>서재</title>
<!--
  책 모드 — 집에서 폰으로 편하게 읽는 화면. 위장(DevTools 흉내)은 하지 않는다.

  서재와 책갈피는 데스크톱 리더(dt-29ef35/)와 같은 서버 데이터를 쓴다. 폰에서 찍은
  자리를 PC 리더에서 그대로 이어 읽을 수 있고, 그 반대도 된다. 책갈피의 단위는
  양쪽 모두 "문단 번호"라 서로 호환된다.

  주소: #/          서재 목록
        #/b/<id>    책 읽기   (폰의 뒤로 가기가 그대로 서재로 돌아간다)
-->
<style>
  :root {
    --fs: 17px; --lh: 1.85; --w: 34em;
    --font: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  }
  :root[data-theme="light"] { --bg:#fbfaf7; --fg:#1f1f1f; --muted:#6b6b6b; --line:#e6e3dc; --accent:#2f6fde; --mark:#fff1bf; --card:#ffffff; }
  :root[data-theme="sepia"] { --bg:#f4ecd8; --fg:#3b2f22; --muted:#7a6a55; --line:#e0d3b6; --accent:#9a5b20; --mark:#efdcaa; --card:#f8f1e1; }
  :root[data-theme="dark"]  { --bg:#141414; --fg:#d8d8d8; --muted:#8a8a8a; --line:#2a2a2a; --accent:#7fa7ff; --mark:#3a3320; --card:#1c1c1c; }
  :root[data-font="serif"] { --font: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ── 상단바 — 읽는 중 아래로 내리면 숨고, 위로 올리면 다시 나온다 ── */
  #bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    height: calc(48px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 6px 0;
    background: var(--bg); border-bottom: 1px solid var(--line);
    transition: transform .2s ease;
  }
  #bar.hide { transform: translateY(-100%); }
  #bar .t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  #bar .b { min-width: 40px; height: 40px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  #bar .b:active { background: var(--line); }
  #bar .pct { font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; padding-right: 6px; font-variant-numeric: tabular-nums; }

  /* ── 서재 ── */
  #lib { max-width: 640px; margin: 0 auto; padding: 12px 14px 60px; }
  #q {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); font-size: 15px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  .resume {
    display: block; width: 100%; text-align: left; margin: 12px 0 4px; padding: 14px;
    border-radius: 12px; background: var(--card); border: 1px solid var(--line);
  }
  .resume .k { font-size: 12px; color: var(--accent); font-weight: 600; }
  .resume .n { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .resume .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .sec { font-size: 12px; color: var(--muted); margin: 18px 2px 6px; }
  .item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 12px 4px; border-bottom: 1px solid var(--line);
  }
  .item .n { flex: 1; min-width: 0; }
  .item .n b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .n i { font-style: normal; font-size: 12px; color: var(--muted); }
  .item .bm { font-size: 12px; color: var(--accent); white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ── 본문 ── */
  #read {
    max-width: var(--w); margin: 0 auto;
    padding: 18px 20px calc(40vh + env(safe-area-inset-bottom));
    font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
    word-break: keep-all; overflow-wrap: anywhere;
  }
  #read h1 { font-size: 1.15em; margin: 8px 0 22px; line-height: 1.4; }
  #read p {
    position: relative; margin: 0 0 .85em;
    scroll-margin-top: 64px;
    border-radius: 4px;
  }
  /* 책갈피 — 왼쪽 여백의 막대 + 옅은 바탕. 글자 위치는 움직이지 않는다. */
  #read p.bm { background: var(--mark); box-shadow: -8px 0 0 var(--mark), 8px 0 0 var(--mark); }
  #read p.bm::before {
    content: ""; position: absolute; left: -14px; top: .25em; bottom: .25em;
    width: 3px; border-radius: 2px; background: var(--accent);
  }
  .loading { color: var(--muted); padding: 40px 0; text-align: center; font-family: system-ui, sans-serif; font-size: 14px; }

  /* ── 설정 시트 ── */
  #sheet { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); }
  #sheet .p {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 560px; margin: 0 auto;
    background: var(--card); color: var(--fg);
    border-radius: 16px 16px 0 0; padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 24px rgba(0,0,0,.18);
  }
  .row { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .row .l { flex: 1; font-size: 14px; }
  .row .v { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; font-size: 14px; }
  .step { width: 40px; height: 36px; border-radius: 8px; border: 1px solid var(--line); font-size: 16px; }
  .seg { display: flex; gap: 6px; }
  .seg button { height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; }
  .seg button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 40;
    transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
    background: rgba(20,20,20,.88); color: #fff; font-size: 13px;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    transition: opacity .18s, transform .18s;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header id="bar">
  <button class="b" id="back" hidden aria-label="서재로">←</button>
  <div class="t" id="title">서재</div>
  <span class="pct" id="pct" hidden></span>
  <button class="b" id="goto" hidden aria-label="책갈피로 이동">🔖</button>
  <button class="b" id="opts" aria-label="보기 설정">Aa</button>
</header>

<main id="lib">
  <input id="q" type="search" placeholder="제목 검색" autocomplete="off">
  <div id="libBody"><div class="empty">불러오는 중…</div></div>
</main>

<main id="read" hidden></main>

<div id="sheet" hidden>
  <div class="p" role="dialog" aria-label="보기 설정">
    <div class="row"><span class="l">글자 크기</span>
      <button class="step" data-k="fs" data-d="-1">−</button><span class="v" id="vfs"></span><button class="step" data-k="fs" data-d="1">+</button></div>
    <div class="row"><span class="l">줄 간격</span>
      <button class="step" data-k="lh" data-d="-1">−</button><span class="v" id="vlh"></span><button class="step" data-k="lh" data-d="1">+</button></div>
    <div class="row"><span class="l">본문 폭</span>
      <button class="step" data-k="w" data-d="-1">−</button><span class="v" id="vw"></span><button class="step" data-k="w" data-d="1">+</button></div>
    <div class="row"><span class="l">배경</span>
      <div class="seg" data-g="theme"><button data-v="light">밝게</button><button data-v="sepia">종이</button><button data-v="dark">어둡게</button></div></div>
    <div class="row"><span class="l">글꼴</span>
      <div class="seg" data-g="font"><button data-v="sans">고딕</button><button data-v="serif">명조</button></div></div>
    <div class="row"><span class="l">나갈 때 자리 저장</span>
      <div class="seg" data-g="auto"><button data-v="1">켬</button><button data-v="0">끔</button></div></div>
    <div class="note">문단을 누르면 그 자리가 책갈피가 된다. "나갈 때 자리 저장"을 켜 두면 책을 닫거나 서재로 돌아갈 때 화면 맨 위 문단이 자동으로 책갈피가 된다. 책갈피는 PC 리더와 공유된다.</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ---------- 서버 ---------- */

// API 키는 저장소에 두지 않는다. 배포할 때 GitHub Actions 가 비밀값으로 치환하고,
// 치환되지 않은 상태에서는 주소의 ?k=… 로 한 번 받아 브라우저에 저장해 쓴다.
// (해시는 화면 이동에 쓰므로 키는 쿼리로 받는다.)
const READER_KEY = (() => {
  const baked = "__READER_KEY__";
  if (baked.slice(0, 2) !== "__") return baked;
  try {
    const q = new URLSearchParams(location.search).get("k");
    if (q) { localStorage.setItem("dtkey", q); return q; }
    return localStorage.getItem("dtkey") || "";
  } catch { return ""; }
})();
const API = "https://api.aquapado.com/reader/library?k=" + READER_KEY + "&do=";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- 설정 ---------- */

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* 무시 */ } },
};

const cfg = {
  fs: +LS.get("bk:fs", 17),          // px
  lh: +LS.get("bk:lh", 1.85),
  w:  +LS.get("bk:w", 34),           // em
  theme: LS.get("bk:theme", "light"),
  font: LS.get("bk:font", "sans"),
  auto: LS.get("bk:auto", "1"),
};
const LIMITS = { fs: [13, 26, 1], lh: [1.4, 2.4, 0.05], w: [22, 48, 2] };

function applyCfg() {
  const r = document.documentElement;
  r.style.setProperty("--fs", cfg.fs + "px");
  r.style.setProperty("--lh", cfg.lh);
  r.style.setProperty("--w", cfg.w + "em");
  r.dataset.theme = cfg.theme;
  r.dataset.font = cfg.font;
  const tc = { light: "#fbfaf7", sepia: "#f4ecd8", dark: "#141414" }[cfg.theme] || "#fbfaf7";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", tc);
  $("vfs").textContent = cfg.fs + "px";
  $("vlh").textContent = cfg.lh.toFixed(2);
  $("vw").textContent = cfg.w + "em";
  for (const g of document.querySelectorAll(".seg")) {
    for (const b of g.children) b.classList.toggle("on", b.dataset.v === String(cfg[g.dataset.g]));
  }
}

$("sheet").addEventListener("click", (e) => {
  if (e.target === $("sheet")) { $("sheet").hidden = true; return; }
  const st = e.target.closest(".step");
  if (st) {
    const k = st.dataset.k, [lo, hi, step] = LIMITS[k];
    // 글자 크기·폭을 바꾸면 읽던 문단이 화면 밖으로 밀려나므로, 바꾸기 전 맨 위
    // 문단을 기억했다가 바꾼 뒤 그 자리로 돌려놓는다.
    const keep = cur ? topVisible() : null;
    cfg[k] = Math.round(Math.min(hi, Math.max(lo, cfg[k] + step * +st.dataset.d)) * 100) / 100;
    LS.set("bk:" + k, cfg[k]);
    applyCfg();
    if (keep !== null) jumpTo(keep, "auto");
    return;
  }
  const sb = e.target.closest(".seg button");
  if (sb) {
    const g = sb.parentElement.dataset.g;
    cfg[g] = sb.dataset.v; LS.set("bk:" + g, cfg[g]);
    applyCfg();
  }
});
$("opts").addEventListener("click", () => { $("sheet").hidden = false; });

/* ---------- 알림 ---------- */

let toastTimer = 0;
function toast(t) {
  const el = $("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 1600);
}

/* ---------- 서재 ---------- */

let items = [];

async function loadLib() {
  try {
    const d = await (await fetch(API + "list")).json();
    items = d.ok ? d.items : [];
    if (!d.ok) $("libBody").innerHTML = `<div class="empty">서재를 못 불러왔다 (${esc(d.error || "")})</div>`;
  } catch (e) {
    items = [];
    $("libBody").innerHTML = `<div class="empty">서재를 못 불러왔다</div>`;
    return;
  }
  // 제목의 숫자를 숫자로 비교해 1권·2권·…·10권 순서가 되게 한다.
  items.sort((a, b) => (a.title || a.url).localeCompare(b.title || b.url, "ko", { numeric: true }));
  renderLib();
}

function renderLib() {
  const q = $("q").value.trim().toLowerCase();
  const list = q ? items.filter((it) => (it.title || it.url).toLowerCase().includes(q)) : items;

  // 가장 최근에 책갈피가 찍힌 책을 맨 위에 "이어 읽기"로 꺼내 둔다.
  const last = items.filter((it) => it.read_at).sort((a, b) => (b.read_at > a.read_at ? 1 : -1))[0];
  let html = "";
  if (last && !q) {
    html += `<button class="resume" data-id="${esc(last.id)}">
      <div class="k">이어 읽기</div>
      <div class="n">${esc(last.title || last.url)}</div>
      <div class="m">${esc(String(last.read_at).slice(0, 16).replace("T", " "))}</div></button>`;
  }
  html += `<div class="sec">${list.length}권</div>`;
  if (!list.length) html += `<div class="empty">${q ? "검색 결과 없음" : "비어 있음"}</div>`;
  for (const it of list) {
    const man = it.chars >= 10000 ? (Math.round(it.chars / 1000) / 10) + "만 자" : it.chars + "자";
    const has = it.pos_idx !== null && it.pos_idx !== undefined && +it.pos_idx > 0;
    html += `<button class="item" data-id="${esc(it.id)}">
      <span class="n"><b>${esc(it.title || it.url)}</b><i>${man}</i></span>
      ${has ? `<span class="bm">🔖 읽는 중</span>` : ""}</button>`;
  }
  $("libBody").innerHTML = html;
}

$("q").addEventListener("input", renderLib);
let fromLib = false;   // 서재에서 눌러 들어왔는지 — 뒤로 가기를 어떻게 할지 정한다
$("libBody").addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (!b) return;
  fromLib = true;
  location.hash = "#/b/" + encodeURIComponent(b.dataset.id);
});

/* ---------- 읽기 ---------- */

let cur = null;      // { id, title, n }
let bm = null;       // 책갈피 문단 번호

async function openBook(id) {
  $("read").innerHTML = `<div class="loading">불러오는 중…</div>`;
  $("title").textContent = (items.find((it) => it.id === id) || {}).title || "…";
  cur = null; bm = null;

  let doc, pos = null;
  try {
    // 본문은 CDN 캐시로 받고, 위치는 따로 새로 묻는다. 목록에도 위치가 실려 오지만
    // 목록은 캐시라 다른 기기에서 막 찍은 책갈피가 몇 분 늦게 보일 수 있다.
    const [g, p] = await Promise.all([
      fetch(API + "get&id=" + encodeURIComponent(id)).then((r) => r.json()),
      fetch(API + "pos&id=" + encodeURIComponent(id)).then((r) => r.json()).catch(() => null),
    ]);
    if (!g.ok) throw new Error(g.error || "불러오기 실패");
    doc = g.doc; pos = p;
  } catch (e) {
    $("read").innerHTML = `<div class="loading">못 불러왔다 — ${esc(e.message || e)}</div>`;
    return;
  }

  const paras = doc.paras || [];
  cur = { id, title: doc.title || doc.url, n: paras.length };
  $("title").textContent = cur.title;

  // 한 권이 4천 문단이 넘어도 문단마다 <p> 하나라 통째로 그려도 가볍다.
  // 다시 그리는 일이 없고, 책갈피는 해당 문단의 클래스만 바꾼다.
  let html = `<h1>${esc(cur.title)}</h1>`;
  for (let i = 0; i < paras.length; i++) html += `<p data-i="${i}">${esc(paras[i])}</p>`;
  $("read").innerHTML = html;
  pList = $("read").querySelectorAll("p[data-i]");

  // 서버 위치가 없으면(오프라인 등) 이 기기에 남긴 위치를 쓴다.
  if (pos && pos.ok && pos.idx !== null && pos.idx !== undefined) bm = +pos.idx;
  else { const l = LS.get("bk:pos:" + id, null); bm = l === null ? null : +l; }
  if (bm !== null && bm >= paras.length) bm = paras.length - 1;

  if (bm !== null && bm > 0) {
    markBm(bm);
    // scrollIntoView 는 레이아웃을 그 자리에서 계산하므로 바로 불러도 정확하다.
    // requestAnimationFrame 으로 미루면 화면이 가려진 탭에서는 아예 실행되지 않아
    // 맨 위에 멈춰 있었다. 글꼴이 늦게 잡혀 줄 높이가 바뀌는 경우에 대비해 한 번 더 맞춘다.
    jumpTo(bm, "auto");
    setTimeout(() => { jumpTo(bm, "auto"); updatePct(); }, 80);
    updatePct();
    toast("책갈피에서 이어 읽기");
  } else {
    if (bm === 0) markBm(0);
    window.scrollTo(0, 0);
    updatePct();
  }
}

function pEl(i) { return $("read").querySelector(`p[data-i="${i}"]`); }

function markBm(i) {
  const old = $("read").querySelector("p.bm");
  if (old) old.classList.remove("bm");
  const el = pEl(i);
  if (el) el.classList.add("bm");
}

function jumpTo(i, behavior) {
  const el = pEl(i);
  if (el) el.scrollIntoView({ block: "start", behavior: behavior || "smooth" });
}

// 화면 맨 위에 걸친 문단. 문단은 위에서 아래로 차례로 놓여 있으니 이분 탐색으로
// 찾는다. 예전엔 화면 좌표로 짚었는데, 설정 시트가 화면을 덮고 있으면 시트 배경을
// 짚어 아무것도 못 찾았고, 그래서 글자 크기를 바꾸면 읽던 자리를 잃었다.
let pList = [];
function topVisible() {
  if (!cur || !pList.length) return null;
  const bar = $("bar");
  const top = bar.classList.contains("hide") ? 0 : bar.getBoundingClientRect().bottom;
  let lo = 0, hi = pList.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (pList[mid].getBoundingClientRect().bottom > top + 4) { ans = mid; hi = mid - 1; }
    else lo = mid + 1;
  }
  return ans < 0 ? null : +pList[ans].dataset.i;
}

function pushPos(i) {
  if (!cur || i === null) return;
  LS.set("bk:pos:" + cur.id, i);
  const url = API + "pos&id=" + encodeURIComponent(cur.id);
  const body = JSON.stringify({ idx: i, win: 20 });
  try {
    // 창을 닫는 중에는 fetch 가 끊길 수 있어 sendBeacon 을 먼저 쓴다.
    if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: "text/plain" }))) return;
  } catch { /* 아래로 */ }
  fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body, keepalive: true }).catch(() => {});
}

// 문단을 누르면 그 자리가 책갈피. 글자를 길게 눌러 고르는 중이면 건드리지 않는다.
$("read").addEventListener("click", (e) => {
  const p = e.target.closest("p[data-i]");
  if (!p || !cur) return;
  const sel = window.getSelection && String(window.getSelection());
  if (sel) return;
  bm = +p.dataset.i;
  markBm(bm);
  pushPos(bm);
  toast("책갈피 · " + Math.round(((bm + 1) / cur.n) * 100) + "%");
});

$("goto").addEventListener("click", () => {
  if (bm === null) { toast("책갈피가 아직 없다 — 문단을 눌러 찍는다"); return; }
  // 한 권이 수십만 픽셀이라 부드러운 스크롤은 한참 굴러가다 끊기기 쉽다. 바로 간다.
  jumpTo(bm, "auto");
});

/* ---------- 스크롤 — 진행률·상단바 ---------- */

function updatePct() {
  if (!cur) return;
  const i = topVisible();
  if (i !== null) $("pct").textContent = Math.round(((i + 1) / cur.n) * 100) + "%";
}

let lastY = 0, ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const y = window.scrollY;
    if (cur) {
      if (y > lastY + 8 && y > 120) $("bar").classList.add("hide");
      else if (y < lastY - 8) $("bar").classList.remove("hide");
      updatePct();
    }
    lastY = y;
  });
}, { passive: true });

/* ---------- 나갈 때 ---------- */

function autoSave() {
  if (!cur || cfg.auto !== "1") return;
  const i = topVisible();
  if (i === null) return;
  bm = i;
  pushPos(i);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autoSave(); });
window.addEventListener("pagehide", autoSave);

/* ---------- 화면 전환 ---------- */

function route() {
  const m = location.hash.match(/^#\/b\/(.+)$/);
  if (m) {
    $("lib").hidden = true; $("read").hidden = false;
    $("back").hidden = false; $("goto").hidden = false; $("pct").hidden = false;
    $("bar").classList.remove("hide");
    openBook(decodeURIComponent(m[1]));
  } else {
    autoSave();
    cur = null; pList = [];
    $("read").hidden = true; $("read").innerHTML = "";
    $("lib").hidden = false;
    $("back").hidden = true; $("goto").hidden = true; $("pct").hidden = true;
    $("bar").classList.remove("hide");
    $("title").textContent = "서재";
    document.title = "서재";
    loadLib();
  }
}
$("back").addEventListener("click", () => {
  // 서재에서 들어왔으면 뒤로 가기, 주소로 바로 들어왔으면 서재로 바꿔 끼운다.
  if (fromLib) { fromLib = false; history.back(); }
  else location.hash = "#/";
});
window.addEventListener("hashchange", route);

applyCfg();
route();
</script>
