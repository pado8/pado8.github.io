<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>DevTools - localhost:3000</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%239aa0a6' stroke-width='2'/%3E%3C/svg%3E">
<style>
  /* 진짜 DevTools 도 두 테마를 다 쓴다. 라이트 쪽 구문 색(태그 보라·속성명
     갈색·속성값 파랑)은 크롬이 실제로 쓰는 조합 그대로다. */
  :root {
    --bg: #202124;
    --fg: #e8eaed;
    --panel: #292a2d;
    --line: #3c4043;
    --line2: #35363a;
    --muted: #9aa0a6;
    --dim: #6e7175;
    --accent: #8ab4f8;
    --tag: #5db0d7;
    --attr: #9bbbdc;
    --val: #f29766;
    --hover: #2b2c2f;
    --sel: #1f3d5c;
    --sels: #d7d7db;
    --warn: #f28b82;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --fg: #333333;
    --panel: #f3f3f3;
    --line: #cdcdcd;
    --line2: #e0e0e0;
    --muted: #5f6368;
    --dim: #80868b;
    --accent: #1a73e8;
    --tag: #881280;
    --attr: #994500;
    --val: #1a1aa6;
    --hover: #f0f0f0;
    --sel: #cfe8fc;
    --sels: #222222;
    --warn: #d93025;
  }

  /* Chrome DevTools 다크 테마를 그대로 흉내낸다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 12px/1.5 Consolas, "Courier New", monospace;
    overflow: hidden; user-select: none;
  }

  /* ── 상단 탭바 ── */
  #topbar {
    display: flex; align-items: center; height: 27px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
    color: var(--muted); flex-shrink: 0;
  }
  .ticon { width: 26px; text-align: center; font-size: 13px; cursor: default; }
  .ticon.active { color: var(--accent); }
  #topbar .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
  .tab { padding: 0 10px; line-height: 26px; cursor: default; white-space: nowrap; }
  .tab.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  .gear { width: 24px; text-align: center; font-size: 13px; cursor: default; }
  .savebtn { width: 24px; text-align: center; font-size: 13px; cursor: default; color: var(--muted); }
  .savebtn:hover { color: var(--accent); }
  .navbtn { min-width: 22px; height: 20px; line-height: 18px; text-align: center; padding: 0 7px;
            border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
            color: var(--fg); cursor: pointer; margin: 0 2px; font-size: 13px; user-select: none; }
  .navbtn:hover { border-color: var(--accent); color: var(--accent); }
  .navbtn.off { color: var(--dim); opacity: .4; cursor: default; }
  .navbtn.off:hover { border-color: var(--line); color: var(--dim); }
  .row.read .txt { color: var(--dim); }   /* 서재에서 한 번 읽은 항목 — 회색 */

  /* ── 모바일(좁은 화면) — Styles 패널·가짜 탭 숨겨 본문에 전체폭. 문단은 기본 전체 펼침이라 스크롤로 읽음. ── */
  @media (max-width: 640px) {
    #styles, #dragbar { display: none; }
    #topbar { overflow-x: auto; }
    #topbar .tab:not([data-view]) { display: none; }
    .ticon, .warnbadge, .kebab { display: none; }
    .navbtn { min-width: 32px; height: 26px; line-height: 24px; padding: 0 10px; font-size: 15px; }
    .savebtn, .gear { width: 30px; font-size: 15px; }
    #treeWrap { padding: 4px 0 64px; -webkit-overflow-scrolling: touch; }
  }
  .savemsg { color: var(--accent); font-size: 11px; margin-right: 8px; white-space: nowrap;
             font-family: "Segoe UI", system-ui, sans-serif; }
  .gear.on { color: var(--fg); }
  .setgrp { color: var(--muted); font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px;
            text-transform: uppercase; letter-spacing: .04em; padding: 14px 0 6px 12px; }
  .setrow { display: flex; align-items: center; gap: 10px; padding: 5px 12px;
            font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; color: var(--fg); }
  .setrow:hover { background: var(--hover); }
  .setlab { flex: 1; }
  .setval { min-width: 62px; text-align: center; color: var(--val); font-family: Consolas, monospace; }
  .setbtn { width: 22px; height: 20px; line-height: 18px; text-align: center; border: 1px solid var(--line);
            border-radius: 4px; background: var(--panel); color: var(--fg); cursor: default; }
  .setbtn:hover { border-color: var(--accent); }
  .sethint { color: var(--dim); font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px;
             padding: 10px 12px 0; line-height: 1.7; }

  #topbar .grow { flex: 1; }
  .warnbadge { color: var(--warn); margin-right: 6px; font-size: 11px; }
  .kebab { width: 26px; text-align: center; letter-spacing: 1px; }

  /* ── 본문 분할 ── */
  #main { display: flex; height: calc(100% - 27px - 24px); }
  #leftcol { flex: 1; min-width: 200px; display: flex; flex-direction: column; min-height: 0; }
  #treeWrap { flex: 1; overflow: auto; padding: 2px 0 40px; font-size: var(--fs, 13px); }
  /* 반페이지 모드 — 위쪽은 영어 마크업만 보여 한글 분량을 절반으로 줄인다 */
  #fakeWrap { display: none; overflow: hidden; padding: 2px 0;
              border-bottom: 1px solid var(--line); font-size: var(--fs, 13px); }
  #leftcol.half #fakeWrap { display: block; flex: 1 1 50%; min-height: 0; order: 0; }
  #leftcol.half #treeWrap { flex: 1 1 50%; min-height: 0; order: 1; }
  /* 읽는 영역을 위로 — 순서를 바꾸고 경계선도 반대쪽으로 옮긴다 */
  #leftcol.half.readtop #fakeWrap { order: 1; border-bottom: none; border-top: 1px solid var(--line); }
  #leftcol.half.readtop #treeWrap { order: 0; }
  #dragbar { width: 1px; background: var(--line); cursor: col-resize; position: relative; }
  #dragbar::after { content: ""; position: absolute; left: -3px; right: -3px; top: 0; bottom: 0; }
  #styles {
    width: 320px; min-width: 120px; max-width: 70vw; flex-shrink: 0;
    border-left: 1px solid var(--line); overflow: auto;
    font-family: Consolas, monospace;
  }

  /* ── DOM 트리 ── */
  .row { padding: 0 4px 0 0; white-space: pre-wrap; word-break: break-all; cursor: default; }
  /* 줄 호버 강조는 두지 않는다 — 읽는 중에 마우스가 지나가면 시선을 뺏긴다 */
  .row.sel { background: var(--sel); }
  .arrow { display: inline-block; width: 11px; color: var(--muted); font-size: 9px; }
  .tagname { color: var(--tag); }
  .attr { color: var(--attr); }
  .attrval { color: var(--val); }
  .brak { color: var(--muted); }
  .txt { color: var(--fg); }
  .dots { color: var(--muted); }
  .doctype { color: var(--muted); }

  /* ── Styles 패널 ── */
  #styles .stabs {
    display: flex; height: 27px; align-items: center;
    border-bottom: 1px solid var(--line); background: var(--panel);
    font-family: "Segoe UI", system-ui, sans-serif; color: var(--muted);
    position: sticky; top: 0;
  }
  #styles .stabs .tab { padding: 0 8px; font-size: 12px; }
  #styles .sfilter {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px;
    border-bottom: 1px solid var(--line); color: var(--muted);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px;
  }
  #styles .sfilter .box {
    flex: 1; border: 1px solid var(--line); border-radius: 8px;
    padding: 1px 8px; color: var(--dim);
  }
  .rule { padding: 4px 8px 6px; border-bottom: 1px solid var(--line2); }
  .rule .src { float: right; color: var(--muted); font-size: 11px; }
  .sels { color: var(--sels); }
  .prop { color: var(--attr); padding-left: 16px; }
  .pval { color: var(--val); }
  .rule .cb { display: inline-block; width: 10px; }

  /* ── 하단 breadcrumb ── */
  #crumbs {
    height: 24px; line-height: 23px; background: var(--panel);
    border-top: 1px solid var(--line); padding: 0 8px; color: var(--muted);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
    white-space: nowrap; overflow: hidden; flex-shrink: 0;
  }
  #crumbs b { color: var(--fg); font-weight: normal; }
  #crumbs .gt { margin: 0 5px; color: var(--dim); }

  /* ── URL 입력(검색바처럼 위장) ── */
  #findbar {
    display: none; position: absolute; top: 27px; right: 340px; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-top: none;
    padding: 4px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #findbar input {
    width: 420px; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); padding: 3px 8px; font: 12px Consolas, monospace;
    outline: none;
  }
  #findbar input:focus { border-color: var(--accent); }
  #findbar .hint { color: var(--dim); font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="ticon active" title="">⌖</span>
  <span class="ticon">▤</span>
  <span class="sep"></span>
  <span class="tab" data-view="read">Elements</span>
  <span class="tab" data-view="lib">Console</span>
  <span class="tab">Sources</span>
  <span class="tab">Network</span>
  <span class="tab">Performance</span>
  <span class="tab">Memory</span>
  <span class="tab">Application</span>
  <span class="tab" data-view="set">Security</span>
  <span class="sep"></span>
  <span class="navbtn off" id="btnPrev" title="이전화">‹</span>
  <span class="navbtn" id="btnSave" data-act="save" title="저장">▣</span>
  <span class="navbtn off" id="btnNext" title="다음화">›</span>
  <span class="navbtn off" id="btnSrc" title="원문 페이지 열기">↗</span>
  <span class="grow"></span>
  <span class="savemsg" id="savemsg"></span>
  <span class="warnbadge">▲ 2</span>
  <span class="savebtn" data-act="save" title="Export">⭳</span>
  <span class="gear" data-view="set">⚙</span><span class="kebab">⋮</span>
</div>

<div id="findbar">
  <input id="urlbox" spellcheck="false" placeholder="https://">
  <span class="hint">Enter</span>
</div>

<div id="main">
  <div id="leftcol">
    <div id="fakeWrap"><div id="fake"></div></div>
    <div id="treeWrap"><div id="tree"></div></div>
  </div>
  <div id="dragbar"></div>
  <div id="styles">
    <div class="stabs">
      <span class="tab on" style="color:#e8eaed;box-shadow:inset 0 -2px 0 #8ab4f8">Styles</span>
      <span class="tab">Computed</span>
      <span class="tab">Layout</span>
      <span class="tab">Event Listeners</span>
    </div>
    <div class="sfilter"><span class="box">Filter</span><span>:hov</span><span>.cls</span><span>+</span></div>
    <div id="rules"></div>
  </div>
</div>

<div id="crumbs"></div>

<script>
/*
  가짜 DevTools 리더.
  - 글의 문단들이 DOM 트리의 <p> 노드처럼 그려진다.
  - 현재 읽는 구간만 펼쳐지고(텍스트 보임) 나머지는 접힌 노드(…)로 숨는다.
    -> "보려는 부분만 보인다"는 영역 조절이 DevTools 문법 그대로 구현된다.
  - 오른쪽 Styles 패널 경계를 드래그하면 읽기 영역의 폭도 조절된다.

  조작 (입력창에 포커스 없을 때):
    o        URL 입력창 열기/닫기
    ↓/j ↑/k  다음/이전 문단
    PgDn/PgUp  창 크기만큼 점프
    ] [      한 번에 펼칠 문단 수 +/- (1~20)
    `        보스키 — 전부 접기/복원
    r        다시 불러오기
    접힌 노드 클릭 -> 그 위치로 이동
*/
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

let paras = [];      // 문단들
let idx = 0;         // 현재 창 시작
let win = Infinity;  // 펼칠 문단 수 — 기본은 전부. [ 로 줄이면 창 모드가 된다
let nextUrl = null;  // 프록시가 찾아준 "다음화" URL (없으면 null)
let prevUrl = null;  // 프록시가 찾아준 "이전화" URL (없으면 null)
let libPos = -1;     // 서재에서 연 문서의 목록 내 위치(-1 = 서재 경유 아님)
let libMode = localStorage.getItem("dtlibmode") === "on"; // 서재 보기 모드: ‹ › 로 서재 앞뒤 항목 이동
const readSet = new Set(JSON.parse(localStorage.getItem("dtread") || "[]")); // 한 번 연 서재 문서 id
function markRead(id) {
  if (!id || readSet.has(id)) return;
  readSet.add(id);
  try { localStorage.setItem("dtread", JSON.stringify([...readSet])); } catch { /* 무시 */ }
}
// 저장 시각(UTC)을 한국 시간 "월/일 시:분" 으로. updated_at 은 "2026-08-19T08:26:35Z" 꼴.
function fmtWhen(ts) {
  const d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts || "").slice(0, 10);
  const p = new Intl.DateTimeFormat("ko-KR", { timeZone: "Asia/Seoul",
    month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(d);
  const g = (t) => (p.find((x) => x.type === t) || {}).value || "";
  return `${g("month")}/${g("day")} ${g("hour")}:${g("minute")}`;
}
let boss = false;    // 전부 접힘
let curUrl = "";
// 트리를 클릭하면 본문을 통째로 가리고 개발 문서처럼 보이는 문장으로 바꾼다.
// 예전엔 클릭이 그 문단으로 점프하는 동작이었는데, 접혔다 펼쳐졌다 해서 헷갈렸다.
let mask = false;
let clickMask = localStorage.getItem("dtclick") !== "off";   // 클릭으로 가릴지
let half = localStorage.getItem("dthalf") === "on";          // 반페이지 모드
let halfPos = localStorage.getItem("dthalfpos") === "top" ? "top" : "bottom"; // 읽는 영역 위치
const MASK_TEXT = [
  "요청이 들어오면 미들웨어가 등록된 순서대로 실행된다.",
  "캐시 키는 경로와 쿼리스트링을 합쳐 만든다.",
  "빌드 산출물은 내용 해시가 붙은 파일명으로 배포한다.",
  "의존성이 순환하면 번들러가 경고를 남기고 넘어간다.",
  "테스트는 단위·통합·종단 세 갈래로 나누어 돌린다.",
  "마이그레이션은 되돌릴 수 있는 형태로 작성한다.",
  "인덱스가 없으면 정렬 단계에서 비용이 급격히 커진다.",
  "토큰은 만료 시각을 함께 저장해 두어야 한다.",
  "로그 레벨은 코드가 아니라 환경 변수로 조절한다.",
  "재시도 간격은 지수 백오프로 늘려 나간다.",
  "큐가 밀리면 소비자 수부터 확인하는 편이 빠르다.",
  "정적 자산은 CDN 으로 넘기고 원본 접근은 잠근다.",
  "스키마 변경은 배포보다 한 단계 먼저 적용한다.",
  "타임아웃은 상위 호출보다 짧게 잡아야 의미가 있다.",
  "에러를 삼키지 말고 처리할 수 있는 경계까지 올린다.",
  "설정 기본값은 코드에 두고 비밀은 환경에 둔다.",
  "동시성 문제는 재현 조건을 좁히는 것부터 시작한다.",
  "릴리즈 노트는 구현이 아니라 사용자 관점으로 적는다."
];

let mode = "read";   // "read" | "lib" — 서재 목록을 보는 중인지
let lib = [];        // 서재 항목들

// 글자 크기·줄바꿈 폭은 사이트와 무관한 취향이라 전역으로 기억한다.
const numLS = (k, d, lo, hi) => {
  const v = parseInt(localStorage.getItem(k) || "", 10);
  return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d;
};
let theme = localStorage.getItem("dttheme") === "light" ? "light" : "dark";
let fs = numLS("dtfont", 13, 10, 26);
let wrapAt = numLS("dtwrap", 46, 20, 200);

const LIBAPI = "https://api.aquapado.com/reader/library?k=831fdbe3964d54871e8e2d4a084d279e20ffa4ba&do=";

const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};

/* ---------- 렌더 ---------- */

function line(indent, html, cls = "", data = "") {
  return `<div class="row ${cls}" ${data} style="padding-left:${8 + indent * 14}px">${html}</div>`;
}
const open  = (t, a = "") => `<span class="brak">&lt;</span><span class="tagname">${t}</span>${a}<span class="brak">&gt;</span>`;
const close = (t) => `<span class="brak">&lt;/</span><span class="tagname">${t}</span><span class="brak">&gt;</span>`;
const attr  = (n, v) => ` <span class="attr">${n}</span><span class="brak">=</span><span class="attrval">${v}</span>`;

function chunk(t, width) {
  if (t.length <= width) return [t];
  const out = [];
  let cur = "";
  for (const w of t.split(/(\s+)/)) {
    if (cur.trim() && (cur + w).trim().length > width) { out.push(cur.trim()); cur = ""; }
    cur += w;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

function render() {
  document.documentElement.style.setProperty("--fs", fs + "px");
  document.documentElement.dataset.theme = theme;
  $("leftcol").classList.toggle("half", half);
  $("leftcol").classList.toggle("readtop", halfPos === "top");
  if (half && !$("fake").innerHTML) renderFake();
  document.querySelectorAll("[data-view]").forEach((t) => t.classList.toggle("on", t.dataset.view === mode));
  if (mode === "lib") return renderLib();
  if (mode === "set") return renderSet();
  const src = mask ? MASK_TEXT : paras;
  const out = [];
  out.push(line(0, `<span class="doctype">&lt;!DOCTYPE html&gt;</span>`));
  out.push(line(0, `<span class="arrow">▼</span>` + open("html", attr("lang", "ko"))));
  out.push(line(1, `<span class="arrow">▶</span>` + open("head") + `<span class="dots">…</span>` + close("head")));
  out.push(line(1, `<span class="arrow">▼</span>` + open("body")));
  out.push(line(2, `<span class="arrow">▼</span>` + open("div", attr("id", "app"))));
  out.push(line(3, `<span class="arrow">▼</span>` + open("div", attr("class", "content"))));

  if (!src.length) {
    out.push(line(4, `<span class="dots">${boss ? "" : "(o 를 눌러 URL 입력)"}</span>`));
  }

  const end = mask ? src.length : Math.min(src.length, idx + win);
  for (let i = 0; i < src.length; i++) {
    const expanded = !boss && i >= (mask ? 0 : idx) && i < end;
    if (!expanded) {
      out.push(line(4,
        `<span class="arrow">▶</span>` + open("p", attr("class", "para")) +
        `<span class="dots">…</span>` + close("p"),
        "", `data-i="${i}"`));
      continue;
    }
    const parts = chunk(src[i], wrapAt);
    if (parts.length === 1) {
      out.push(line(4,
        `<span class="arrow">▼</span>` + open("p", attr("class", "para")) +
        `<span class="txt">${esc(parts[0])}</span>` + close("p"),
        !mask && i === idx ? "sel" : "", `data-i="${i}"`));
      continue;
    }
    // 여러 줄로 끊길 땐 여는·닫는 태그를 따로 세워 진짜 트리처럼 보이게 한다.
    out.push(line(4, `<span class="arrow">▼</span>` + open("p", attr("class", "para")),
      !mask && i === idx ? "sel" : "", `data-i="${i}"`));
    for (const part of parts) {
      out.push(line(5, `<span class="txt">${esc(part)}</span>`, "", `data-i="${i}"`));
    }
    out.push(line(4, close("p")));
  }

  out.push(line(3, close("div")));
  out.push(line(2, close("div")));
  out.push(line(2, `<span class="arrow">▶</span>` + open("div", attr("id", "overlay-root")) + `<span class="dots">…</span>` + close("div")));
  out.push(line(1, close("body")));
  out.push(line(0, close("html")));
  $("tree").innerHTML = out.join("");

  $("crumbs").innerHTML =
    `html <span class="gt">&gt;</span> body <span class="gt">&gt;</span> div#app ` +
    `<span class="gt">&gt;</span> div.content <span class="gt">&gt;</span> <b>p.para</b>`;

  const sel = $("tree").querySelector(".row.sel") || $("tree").querySelector(`[data-i="${idx}"]`);
  if (sel) sel.scrollIntoView({ block: "center" });

  if (curUrl) LS.set("pos2:" + curUrl, { idx, win });
  updateNav();
}

// 프록시 두 벌을 순서대로 시도한다.
//   원격: Vercel 함수(미국 리전). "한국 IP만 허용" 규칙을 건 사이트에서는 403.
//   로컬: 이 PC 의 server.mjs. 집 회선 IP 라 브라우저로 직접 여는 것과 같은 조건.
// 그래서 원격이 막히면 로컬로 넘긴다. 로컬 프록시가 안 떠 있으면 그냥 실패한다.
const REMOTE = "https://api.aquapado.com/reader/fetch?k=831fdbe3964d54871e8e2d4a084d279e20ffa4ba&url=";
const LOCAL  = "http://127.0.0.1:4488/fetch?url=";
const CHAIN  = [["원격", REMOTE], ["로컬", LOCAL]];

async function via(base, url) {
  const r = await fetch(base + encodeURIComponent(url));
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "불러오기 실패");
  // 프록시는 차단 페이지도 200 으로 돌려준다 — 대상 사이트의 실제 코드로 판정한다.
  if (d.status && d.status >= 400) throw new Error("대상 사이트가 거부 (HTTP " + d.status + ")");
  return d;
}

async function load(url) {
  curUrl = url;
  // 탭 제목은 절대 읽는 URL을 담지 않는다 — 화면을 접어도(보스키) 탭 스트립·
  // 작업표시줄·Alt+Tab 미리보기에는 제목이 남기 때문. 개발자 탭으로 자연스러운
  // 고정값을 쓴다.
  paras = []; idx = 0; nextUrl = null; prevUrl = null; libPos = -1; updateNav(); render();

  const fails = [];
  for (const [name, base] of CHAIN) {
    let d;
    try { d = await via(base, url); }
    catch (e) { fails.push(name + ": " + (e && e.message || e)); continue; }

    if (d.note === "js-rendered") {
      // 본문을 자바스크립트로 나중에 꽂는 사이트. 첫 HTML 에는 자리표시자뿐이라
      // 메뉴 몇 줄을 본문인 척 보여주는 대신 사실대로 알린다.
      paras = [
        "본문을 가져오지 못했다. 이 사이트는 첫 HTML 에 본문이 없고 자바스크립트가 나중에 채운다.",
        "텍스트만 받아오는 이 방식으로는 닿지 않는다. 아래는 껍데기에서 건진 것 — 대개 메뉴다.",
        ...d.paras,
      ];
    } else {
      paras = d.paras;
    }

    // 기본값 Infinity 를 실제 문단 수로 확정한다 — 그래야 [ 가 첫 입력부터 먹는다.
    if (!Number.isFinite(win)) win = Math.max(1, paras.length);
    const saved = LS.get("pos2:" + url, null);
    if (saved) { idx = Math.min(saved.idx, paras.length - 1); win = saved.win || win; }
    nextUrl = d.nextUrl || null;
    prevUrl = d.prevUrl || null;
    updateNav();
    LS.set("lastUrl", url);
    render();
    return;
  }

  paras = ["불러오기 실패", ...fails];
  render();
}

// 리더 페이지는 프록시로 받아온 본문을 그대로 서재에 넣는다.
let saveMsg = "", msgTimer = 0;

function setMsg(t) {
  saveMsg = t;
  const el = $("savemsg");
  if (el) el.textContent = t;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { saveMsg = ""; const e2 = $("savemsg"); if (e2) e2.textContent = ""; }, 8000);
}

async function saveDoc() {
  if (!curUrl || !paras.length) { setMsg("저장할 본문이 없다"); return; }
  setMsg("저장 중…");
  try {
    const r = await fetch(LIBAPI + "save", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ url: curUrl, title: document.title, paras }),
    });
    let d = null;
    try { d = await r.json(); } catch { /* JSON 이 아닌 응답 */ }
    if (d && d.ok) setMsg("저장됨 " + d.chars + "자");
    else setMsg("저장 실패 · HTTP " + r.status + ((d && d.error) ? " · " + d.error : ""));
  } catch (err) {
    setMsg("저장 실패 · " + ((err && err.message) || err));
  }
}

// 이전/다음 버튼의 활성 상태를 URL 유무로 갱신한다. topbar 는 render() 가 다시
// 그리지 않으므로 버튼 요소를 직접 만진다.
function updateNav() {
  const p = $("btnPrev"), n = $("btnNext");
  if (libMode && libPos >= 0 && lib.length) {
    // 서재 보기 모드: ‹ 이전화=아래(오래된), › 다음화=위(최신). 목록은 최신이 인덱스 0.
    if (p) p.classList.toggle("off", libPos >= lib.length - 1);
    if (n) n.classList.toggle("off", libPos <= 0);
  } else {
    if (p) p.classList.toggle("off", !prevUrl);
    if (n) n.classList.toggle("off", !nextUrl);
  }
  const s = $("btnSrc");
  if (s) s.classList.toggle("off", !(curUrl && /^https?:/i.test(curUrl)));
}

$("topbar").addEventListener("click", (e) => {
  if (e.target.closest('[data-act="save"]')) { saveDoc(); return; }
  if (e.target.closest("#btnPrev")) {
    // 서재는 최신 저장이 위(인덱스 0). '이전화'는 목록에서 더 아래(오래된) = libPos+1
    if (libMode && libPos >= 0 && libPos < lib.length - 1) openDoc(lib[libPos + 1].id);
    else if (prevUrl) load(prevUrl);
    return;
  }
  if (e.target.closest("#btnNext")) {
    // '다음화'는 목록에서 더 위(최신) = libPos-1
    if (libMode && libPos > 0 && lib.length) openDoc(lib[libPos - 1].id);
    else if (nextUrl) load(nextUrl);
    return;
  }
  if (e.target.closest("#btnSrc")) {
    if (curUrl && /^https?:/i.test(curUrl)) window.open(curUrl, "_blank", "noopener");
    return;
  }
});

    out.push(line(3, `<span class="dots">${boss ? "" : "(비어 있음 — 북마클릿에서 s 로 저장)"}</span>`));
  }

async function openLib() {
  mode = "lib"; idx = 0; lib = []; render();
  try {
    const r = await fetch(LIBAPI + "list");
    const d = await r.json();
    lib = d.ok ? d.items : [];
    if (!d.ok) lib = [];
  } catch { lib = []; }
  render();
}

async function openDoc(id) {
  libPos = lib.findIndex((it) => it.id === id);
  markRead(id);
  try {
    const r = await fetch(LIBAPI + "get&id=" + encodeURIComponent(id));
    const d = await r.json();
    if (!d.ok) { paras = ["불러오기 실패: " + (d.error || "")]; mode = "read"; render(); return; }
    curUrl = d.doc.url;
    paras = d.doc.paras || [];
    mode = "read"; idx = 0;
    if (!Number.isFinite(win)) win = Math.max(1, paras.length);
    const saved = LS.get("pos2:" + curUrl, null);
    if (saved) { idx = Math.min(saved.idx, paras.length - 1); win = saved.win || win; }
    clamp(); render();
  } catch (e) {
    paras = ["불러오기 실패: " + e]; mode = "read"; render();
  }
}

const SETS = [
  ["win",  "펼칠 문단 수", () => Math.min(win, Math.max(1, paras.length)) + " / " + paras.length],
  ["fs",   "글자 크기",    () => fs + "px"],
  ["wrap", "줄바꿈 폭",    () => wrapAt + "자"],
  ["theme", "테마",        () => (theme === "light" ? "라이트" : "다크")],
  ["click", "클릭으로 가리기", () => (clickMask ? "켬" : "끔")],
  ["half",  "반페이지 모드",   () => (half ? "켬" : "끔")],
  ["halfpos", "읽는 영역 위치", () => (halfPos === "top" ? "위" : "아래")],
  ["libmode", "서재 보기 모드", () => (libMode ? "켬" : "끔")],
];

function bump(what, d) {
  if (what === "win")  { win = Math.max(1, Math.min(Math.max(1, paras.length), win + d)); boss = false; }
  if (what === "fs")   { fs = Math.max(10, Math.min(26, fs + d)); localStorage.setItem("dtfont", fs); }
  if (what === "wrap") { wrapAt = Math.max(20, Math.min(200, wrapAt + d * 4)); localStorage.setItem("dtwrap", wrapAt); }
  if (what === "theme") { theme = theme === "light" ? "dark" : "light"; localStorage.setItem("dttheme", theme); }
  if (what === "half") { half = !half; localStorage.setItem("dthalf", half ? "on" : "off"); }
  if (what === "halfpos") {
    halfPos = halfPos === "top" ? "bottom" : "top";
    localStorage.setItem("dthalfpos", halfPos);
  }
  if (what === "libmode") { libMode = !libMode; localStorage.setItem("dtlibmode", libMode ? "on" : "off"); }
  if (what === "click") {
    clickMask = !clickMask;
    localStorage.setItem("dtclick", clickMask ? "on" : "off");
    if (!clickMask) mask = false;
  }
  render();
}

  const rows = SETS.map(([k, label, val]) => `

  $("tree").innerHTML =

    `<span class="setbtn" data-act="save" style="width:auto;padding:0 10px">저장</span></div>` +
    `<div class="sethint">${esc(saveMsg || "상단바의 ⭳ 또는 s 키로도 저장한다")}</div>` +
    `<div class="setgrp">Shortcuts</div>` +
    `<div class="sethint">o URL 입력 &nbsp;·&nbsp; l 서재 목록<br>` +
    `숫자 1~9 · 0(10) · a(전부) — 펼칠 문단 수<br>` +
    `&minus; + 글자 크기 &nbsp;·&nbsp; , . 줄바꿈 폭<br>` +
    `h 반페이지 모드 &nbsp;·&nbsp; 본문 클릭 — 전체 가리기<br>` +
    `t 다크/라이트 &nbsp;·&nbsp; j k 문단 이동 &nbsp;·&nbsp; n 다음화 &nbsp;·&nbsp; r 다시 불러오기 &nbsp;·&nbsp; 백틱 전부 접기</div>`;
  $("crumbs").innerHTML = `Preferences <span class="gt">&gt;</span> <b>Reader</b>`;
}

$("topbar").addEventListener("click", (e) => {
  const t = e.target.closest("[data-view]");
  if (!t) return;
  if (t.dataset.view === "lib") { openLib(); return; }
  mode = t.dataset.view; render();
});

/* ---------- 입력 ---------- */

function clamp() {
  idx = Math.max(0, Math.min(idx, Math.max(0, paras.length - 1)));
  win = Math.max(1, Math.min(Math.max(1, paras.length), win));
}

// window 캡처가 document 캡처보다 먼저 잡힌다. 사이트나 확장이 document 단계에서
// 키를 삼키는 경우를 대비해 두 곳에 달고, 표시를 남겨 한 번만 처리한다.
// 물리 키 위치(e.code)를 논리 키로 바꾼다. 입력기가 한글이든 영문이든 같은 자리를
// 누르면 같은 동작이 되도록 — 맥에서 한글 상태로 단축키가 안 먹던 문제.
function codeToKey(e) {
  const c = e.code || "";
  const m = /^(?:Key([A-Z])|Digit([0-9])|Numpad([0-9]))$/.exec(c);
  if (m) return m[1] ? m[1].toLowerCase() : (m[2] || m[3]);
  switch (c) {
    case "Backquote": return "`";
    case "BracketLeft": return "[";
    case "BracketRight": return "]";
    case "Comma": return ",";
    case "Period": return ".";
    case "Minus": return "-";
    case "Equal": return "+";
  }
  return e.key;  // Arrow*, Page*, Enter, Escape 등은 그대로
}

function onKey(e) {
  if (e.__dtSeen) return;
  e.__dtSeen = true;
  if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 중이면 무시(오작동 방지)
  const typing = document.activeElement === $("urlbox");
  if (typing) {
    if (e.key === "Enter") {
      const v = $("urlbox").value.trim();
      if (v) load(/^https?:\/\//.test(v) ? v : "https://" + v);
      toggleFind(false);
    } else if (e.key === "Escape") toggleFind(false);
    return;
  }
  const k = codeToKey(e);
  switch (k) {
    case "o": toggleFind(true); e.preventDefault(); break;
    case "`": boss = !boss; render(); e.preventDefault(); break;
    case "j": case "ArrowDown":
      if (idx >= paras.length - 1 && nextUrl) { load(nextUrl); e.preventDefault(); break; }
      idx++; clamp(); render(); e.preventDefault(); break;
    case "k": case "ArrowUp": idx--; clamp(); render(); e.preventDefault(); break;
    case "n": if (nextUrl) load(nextUrl); e.preventDefault(); break;
    case "PageDown":
      if (idx + win >= paras.length && nextUrl) { load(nextUrl); e.preventDefault(); break; }
      idx += win; clamp(); render(); e.preventDefault(); break;
    case "PageUp": idx -= win; clamp(); render(); e.preventDefault(); break;
    case "]": win++; clamp(); render(); break;
    case "[": win--; clamp(); render(); break;
    case "r": if (curUrl) load(curUrl); break;
    case "h": half = !half; localStorage.setItem("dthalf", half ? "on" : "off"); render(); break;
    case "H":
      halfPos = halfPos === "top" ? "bottom" : "top";
      localStorage.setItem("dthalfpos", halfPos); render(); break;
    case "s": saveDoc(); e.preventDefault(); break;
    case "t": theme = theme === "light" ? "dark" : "light"; localStorage.setItem("dttheme", theme); render(); break;
    case "g": mode = mode === "set" ? "read" : "set"; render(); e.preventDefault(); break;
    case "l": if (mode === "lib") { mode = "read"; render(); } else openLib(); e.preventDefault(); break;
    case "1": case "2": case "3": case "4": case "5":
    case "6": case "7": case "8": case "9":
      win = +k; boss = false; clamp(); render(); break;
    case "0": win = 10; boss = false; clamp(); render(); break;
    case "a": win = Math.max(1, paras.length); boss = false; clamp(); render(); break;
    case "-": case "_": fs = Math.max(10, fs - 1); localStorage.setItem("dtfont", fs); render(); break;
    case "+": case "=": fs = Math.min(26, fs + 1); localStorage.setItem("dtfont", fs); render(); break;
    case ",": case "<": wrapAt = Math.max(20, wrapAt - 4); localStorage.setItem("dtwrap", wrapAt); render(); break;
    case ".": case ">": wrapAt = Math.min(200, wrapAt + 4); localStorage.setItem("dtwrap", wrapAt); render(); break;
  }
}

window.addEventListener("keydown", onKey, true);
document.addEventListener("keydown", onKey, true);

$("tree").addEventListener("click", (e) => {
  if (e.target.closest('[data-act="save"]')) { saveDoc(); render(); return; }
  const b = e.target.closest("[data-set]");
  if (b) { bump(b.dataset.set, +b.dataset.d); return; }
  const doc = e.target.closest("[data-lib]");
  if (doc) { openDoc(doc.dataset.lib); return; }
  if (mode !== "read" || !clickMask) return;
  mask = !mask;          // 본문 가리기 토글 — 클릭이 하는 유일한 일이다
  boss = false;          // 보스키와 겹치면 가림 화면까지 접혀 빈 화면이 된다
  render();
});

function toggleFind(show) {
  $("findbar").style.display = show ? "block" : "none";
  if (show) { $("urlbox").value = curUrl; $("urlbox").focus(); $("urlbox").select(); }
  else $("urlbox").blur();
}

/* Styles 패널 폭 드래그 — 읽기 영역 크기 조절 */
(() => {
  const bar = $("dragbar"), panel = $("styles");
  let on = false;
  bar.addEventListener("mousedown", () => { on = true; document.body.style.cursor = "col-resize"; });
  document.addEventListener("mouseup", () => { on = false; document.body.style.cursor = ""; });
  document.addEventListener("mousemove", (e) => {
    if (!on) return;
    const w = Math.max(120, Math.min(window.innerWidth * 0.7, window.innerWidth - e.clientX));
    panel.style.width = w + "px";
  });
})();

/* ---------- 시작 ---------- */
renderRules();
const last = LS.get("lastUrl", "");
if (last) load(last); else { render(); toggleFind(true); }
</script>
</body>
</html>
