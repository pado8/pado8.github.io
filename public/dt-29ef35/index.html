<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>DevTools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%239aa0a6' stroke-width='2'/%3E%3C/svg%3E">
<style>
  /* Chrome DevTools 다크 테마를 그대로 흉내낸다. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #202124; color: #e8eaed;
    font: 12px/1.5 Consolas, "Courier New", monospace;
    overflow: hidden; user-select: none;
  }

  /* ── 상단 탭바 ── */
  #topbar {
    display: flex; align-items: center; height: 27px;
    background: #292a2d; border-bottom: 1px solid #3c4043;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
    color: #9aa0a6; flex-shrink: 0;
  }
  .ticon { width: 26px; text-align: center; font-size: 13px; cursor: default; }
  .ticon.active { color: #8ab4f8; }
  #topbar .sep { width: 1px; height: 16px; background: #3c4043; margin: 0 4px; }
  .tab { padding: 0 10px; line-height: 26px; cursor: default; white-space: nowrap; }
  .tab.on { color: #e8eaed; box-shadow: inset 0 -2px 0 #8ab4f8; }
  #topbar .grow { flex: 1; }
  .warnbadge { color: #f28b82; margin-right: 6px; font-size: 11px; }
  .kebab { width: 26px; text-align: center; letter-spacing: 1px; }

  /* ── 본문 분할 ── */
  #main { display: flex; height: calc(100% - 27px - 24px); }
  #treeWrap { flex: 1; min-width: 200px; overflow: auto; padding: 2px 0 40px; }
  #dragbar { width: 1px; background: #3c4043; cursor: col-resize; position: relative; }
  #dragbar::after { content: ""; position: absolute; left: -3px; right: -3px; top: 0; bottom: 0; }
  #styles {
    width: 320px; min-width: 120px; max-width: 70vw; flex-shrink: 0;
    border-left: 1px solid #3c4043; overflow: auto;
    font-family: Consolas, monospace;
  }

  /* ── DOM 트리 ── */
  .row { padding: 0 4px 0 0; white-space: pre-wrap; word-break: break-all; cursor: default; }
  .row:hover { background: #2b2c2f; }
  .row.sel { background: #1f3d5c; }
  .arrow { display: inline-block; width: 11px; color: #9aa0a6; font-size: 9px; }
  .tagname { color: #5db0d7; }
  .attr { color: #9bbbdc; }
  .attrval { color: #f29766; }
  .brak { color: #9aa0a6; }
  .txt { color: #e8eaed; }
  .dots { color: #9aa0a6; }
  .doctype { color: #9aa0a6; }

  /* ── Styles 패널 ── */
  #styles .stabs {
    display: flex; height: 27px; align-items: center;
    border-bottom: 1px solid #3c4043; background: #292a2d;
    font-family: "Segoe UI", system-ui, sans-serif; color: #9aa0a6;
    position: sticky; top: 0;
  }
  #styles .stabs .tab { padding: 0 8px; font-size: 12px; }
  #styles .sfilter {
    display: flex; align-items: center; gap: 8px; padding: 3px 6px;
    border-bottom: 1px solid #3c4043; color: #9aa0a6;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px;
  }
  #styles .sfilter .box {
    flex: 1; border: 1px solid #3c4043; border-radius: 8px;
    padding: 1px 8px; color: #6e7175;
  }
  .rule { padding: 4px 8px 6px; border-bottom: 1px solid #35363a; }
  .rule .src { float: right; color: #9aa0a6; font-size: 11px; }
  .sels { color: #d7d7db; }
  .prop { color: #9bbbdc; padding-left: 16px; }
  .pval { color: #f29766; }
  .rule .cb { display: inline-block; width: 10px; }

  /* ── 하단 breadcrumb ── */
  #crumbs {
    height: 24px; line-height: 23px; background: #292a2d;
    border-top: 1px solid #3c4043; padding: 0 8px; color: #9aa0a6;
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px;
    white-space: nowrap; overflow: hidden; flex-shrink: 0;
  }
  #crumbs b { color: #e8eaed; font-weight: normal; }
  #crumbs .gt { margin: 0 5px; color: #6e7175; }

  /* ── URL 입력(검색바처럼 위장) ── */
  #findbar {
    display: none; position: absolute; top: 27px; right: 340px; z-index: 5;
    background: #292a2d; border: 1px solid #3c4043; border-top: none;
    padding: 4px 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  #findbar input {
    width: 420px; background: #202124; color: #e8eaed;
    border: 1px solid #3c4043; padding: 3px 8px; font: 12px Consolas, monospace;
    outline: none;
  }
  #findbar input:focus { border-color: #8ab4f8; }
  #findbar .hint { color: #6e7175; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>

<div id="topbar">
  <span class="ticon active" title="">⌖</span>
  <span class="ticon">▤</span>
  <span class="sep"></span>
  <span class="tab on">Elements</span>
  <span class="tab">Console</span>
  <span class="tab">Sources</span>
  <span class="tab">Network</span>
  <span class="tab">Performance</span>
  <span class="tab">Memory</span>
  <span class="tab">Application</span>
  <span class="tab">Security</span>
  <span class="grow"></span>
  <span class="warnbadge">▲ 2</span>
  <span class="kebab">⋮</span>
</div>

<div id="findbar">
  <input id="urlbox" spellcheck="false" placeholder="https://">
  <span class="hint">Enter</span>
</div>

<div id="main">
  <div id="treeWrap"><div id="tree"></div></div>
  <div id="dragbar"></div>
  <div id="styles">
    <div class="stabs">
      <span class="tab on" style="color:#e8eaed;box-shadow:inset 0 -2px 0 #8ab4f8">Styles</span>
      <span class="tab">Computed</span>
      <span class="tab">Layout</span>
      <span class="tab">Event Listeners</span>
    </div>
    <div class="sfilter"><span class="box">Filter</span><span>:hov</span><span>.cls</span><span>+</span></div>
    <div id="rules"></div>
  </div>
</div>

<div id="crumbs"></div>

<script>
/*
  가짜 DevTools 리더.
  - 글의 문단들이 DOM 트리의 <p> 노드처럼 그려진다.
  - 현재 읽는 구간만 펼쳐지고(텍스트 보임) 나머지는 접힌 노드(…)로 숨는다.
    -> "보려는 부분만 보인다"는 영역 조절이 DevTools 문법 그대로 구현된다.
  - 오른쪽 Styles 패널 경계를 드래그하면 읽기 영역의 폭도 조절된다.

  조작 (입력창에 포커스 없을 때):
    o        URL 입력창 열기/닫기
    ↓/j ↑/k  다음/이전 문단
    PgDn/PgUp  창 크기만큼 점프
    ] [      한 번에 펼칠 문단 수 +/- (1~20)
    `        보스키 — 전부 접기/복원
    r        다시 불러오기
    접힌 노드 클릭 -> 그 위치로 이동
*/
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

let paras = [];      // 문단들
let idx = 0;         // 현재 창 시작
let win = 3;         // 펼칠 문단 수
let boss = false;    // 전부 접힘
let curUrl = "";

const LS = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
};

/* ---------- 렌더 ---------- */

function line(indent, html, cls = "", data = "") {
  return `<div class="row ${cls}" ${data} style="padding-left:${8 + indent * 14}px">${html}</div>`;
}
const open  = (t, a = "") => `<span class="brak">&lt;</span><span class="tagname">${t}</span>${a}<span class="brak">&gt;</span>`;
const close = (t) => `<span class="brak">&lt;/</span><span class="tagname">${t}</span><span class="brak">&gt;</span>`;
const attr  = (n, v) => ` <span class="attr">${n}</span><span class="brak">=</span><span class="attrval">"${v}"</span>`;

function render() {
  const out = [];
  out.push(line(0, `<span class="doctype">&lt;!DOCTYPE html&gt;</span>`));
  out.push(line(0, `<span class="arrow">▼</span>` + open("html", attr("lang", "ko"))));
  out.push(line(1, `<span class="arrow">▶</span>` + open("head") + `<span class="dots">…</span>` + close("head")));
  out.push(line(1, `<span class="arrow">▼</span>` + open("body")));
  out.push(line(2, `<span class="arrow">▼</span>` + open("div", attr("id", "app"))));
  out.push(line(3, `<span class="arrow">▼</span>` + open("div", attr("class", "content"))));

  if (!paras.length) {
    out.push(line(4, `<span class="dots">${boss ? "" : "(o 를 눌러 URL 입력)"}</span>`));
  }

  const end = Math.min(paras.length, idx + win);
  for (let i = 0; i < paras.length; i++) {
    const expanded = !boss && i >= idx && i < end;
    if (expanded) {
      out.push(line(4,
        `<span class="arrow">▼</span>` + open("p", attr("class", "para")) +
        `<span class="txt">"${esc(paras[i])}"</span>` + close("p"),
        i === idx ? "sel" : "", `data-i="${i}"`));
    } else {
      out.push(line(4,
        `<span class="arrow">▶</span>` + open("p", attr("class", "para")) +
        `<span class="dots">…</span>` + close("p"),
        "", `data-i="${i}"`));
    }
  }

  out.push(line(3, close("div")));
  out.push(line(2, close("div")));
  out.push(line(2, `<span class="arrow">▶</span>` + open("div", attr("id", "overlay-root")) + `<span class="dots">…</span>` + close("div")));
  out.push(line(1, close("body")));
  out.push(line(0, close("html")));
  $("tree").innerHTML = out.join("");

  $("crumbs").innerHTML =
    `html <span class="gt">&gt;</span> body <span class="gt">&gt;</span> div#app ` +
    `<span class="gt">&gt;</span> div.content <span class="gt">&gt;</span> <b>p.para</b>`;

  const sel = $("tree").querySelector(".row.sel") || $("tree").querySelector(`[data-i="${idx}"]`);
  if (sel) sel.scrollIntoView({ block: "center" });

  if (curUrl) LS.set("pos:" + curUrl, { idx, win });
}

function renderRules() {
  $("rules").innerHTML = `
    <div class="rule"><span class="sels">element.style</span> <span class="brak">{</span><br><span class="brak" style="padding-left:16px">}</span></div>
    <div class="rule"><span class="src">app.css:41</span><span class="sels">.content</span> <span class="brak">{</span>
      <div class="prop">max-width<span class="brak">:</span> <span class="pval">720px</span><span class="brak">;</span></div>
      <div class="prop">margin<span class="brak">:</span> <span class="pval">0 auto</span><span class="brak">;</span></div>
      <div class="prop">padding<span class="brak">:</span> <span class="pval">24px 16px</span><span class="brak">;</span></div>
      <span class="brak">}</span></div>
    <div class="rule"><span class="src">app.css:18</span><span class="sels">p</span> <span class="brak">{</span>
      <div class="prop">line-height<span class="brak">:</span> <span class="pval">1.7</span><span class="brak">;</span></div>
      <div class="prop">margin<span class="brak">:</span> <span class="pval">0 0 12px</span><span class="brak">;</span></div>
      <div class="prop">word-break<span class="brak">:</span> <span class="pval">keep-all</span><span class="brak">;</span></div>
      <span class="brak">}</span></div>
    <div class="rule"><span class="src">app.css:1</span><span class="sels">body</span> <span class="brak">{</span>
      <div class="prop">font-family<span class="brak">:</span> <span class="pval">"Noto Sans KR", sans-serif</span><span class="brak">;</span></div>
      <div class="prop">color<span class="brak">:</span> <span class="pval">#212529</span><span class="brak">;</span></div>
      <div class="prop">background<span class="brak">:</span> <span class="pval">#fff</span><span class="brak">;</span></div>
      <span class="brak">}</span></div>
    <div class="rule"><span class="src">user agent stylesheet</span><span class="sels">p</span> <span class="brak">{</span>
      <div class="prop">display<span class="brak">:</span> <span class="pval">block</span><span class="brak">;</span></div>
      <span class="brak">}</span></div>`;
}

/* ---------- 로드 ---------- */

async function load(url) {
  curUrl = url;
  document.title = "DevTools - " + url.replace(/^https?:\/\//, "");
  paras = []; idx = 0; render();
  try {
    const r = await fetch("https://api.aquapado.com/reader/fetch?k=831fdbe3964d54871e8e2d4a084d279e20ffa4ba&url=" + encodeURIComponent(url));
    const d = await r.json();
    if (!d.ok) { paras = ["불러오기 실패: " + d.error]; render(); return; }
    paras = d.paras;
    const saved = LS.get("pos:" + url, null);
    if (saved) { idx = Math.min(saved.idx, paras.length - 1); win = saved.win || win; }
    LS.set("lastUrl", url);
    render();
  } catch (e) {
    paras = ["서버 오류: " + e]; render();
  }
}

/* ---------- 입력 ---------- */

function clamp() {
  idx = Math.max(0, Math.min(idx, Math.max(0, paras.length - 1)));
  win = Math.max(1, Math.min(20, win));
}

document.addEventListener("keydown", (e) => {
  const typing = document.activeElement === $("urlbox");
  if (typing) {
    if (e.key === "Enter") {
      const v = $("urlbox").value.trim();
      if (v) load(/^https?:\/\//.test(v) ? v : "https://" + v);
      toggleFind(false);
    } else if (e.key === "Escape") toggleFind(false);
    return;
  }
  switch (e.key) {
    case "o": toggleFind(true); e.preventDefault(); break;
    case "`": boss = !boss; render(); e.preventDefault(); break;
    case "j": case "ArrowDown": idx++; clamp(); render(); e.preventDefault(); break;
    case "k": case "ArrowUp": idx--; clamp(); render(); e.preventDefault(); break;
    case "PageDown": idx += win; clamp(); render(); e.preventDefault(); break;
    case "PageUp": idx -= win; clamp(); render(); e.preventDefault(); break;
    case "]": win++; clamp(); render(); break;
    case "[": win--; clamp(); render(); break;
    case "r": if (curUrl) load(curUrl); break;
  }
});

$("tree").addEventListener("click", (e) => {
  const row = e.target.closest("[data-i]");
  if (!row) return;
  idx = parseInt(row.dataset.i, 10);
  boss = false; clamp(); render();
});

function toggleFind(show) {
  $("findbar").style.display = show ? "block" : "none";
  if (show) { $("urlbox").value = curUrl; $("urlbox").focus(); $("urlbox").select(); }
  else $("urlbox").blur();
}

/* Styles 패널 폭 드래그 — 읽기 영역 크기 조절 */
(() => {
  const bar = $("dragbar"), panel = $("styles");
  let on = false;
  bar.addEventListener("mousedown", () => { on = true; document.body.style.cursor = "col-resize"; });
  document.addEventListener("mouseup", () => { on = false; document.body.style.cursor = ""; });
  document.addEventListener("mousemove", (e) => {
    if (!on) return;
    const w = Math.max(120, Math.min(window.innerWidth * 0.7, window.innerWidth - e.clientX));
    panel.style.width = w + "px";
  });
})();

/* ---------- 시작 ---------- */
renderRules();
const last = LS.get("lastUrl", "");
if (last) load(last); else { render(); toggleFind(true); }
</script>
</body>
</html>
